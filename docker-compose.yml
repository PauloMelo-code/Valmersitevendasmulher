# Só para testar no PC. No Easypanel o Postgres é um serviço separado.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pagina_vendas_dev
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5441:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
